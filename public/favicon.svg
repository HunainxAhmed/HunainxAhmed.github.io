<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background glow gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0080ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#05070f" stop-opacity="0" />
    </radialGradient>

    <!-- Outer border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.6" />
    </linearGradient>

    <!-- Main Glyph gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="30%" stop-color="#00f0ff" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Top highlight gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Soft glow filter for the spark -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark obsidian background badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#080911" />
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Ambient quantum core glow -->
  <circle cx="32" cy="32" r="26" fill="url(#coreGlow)" />

  <!-- Monogram HA Glyph -->
  <g fill="url(#glyphGrad)">
    <!-- Left Pillar of H -->
    <rect x="15.5" y="15" width="7" height="34" rx="3.5" />

    <!-- Right Pillar of H -->
    <rect x="41.5" y="15" width="7" height="34" rx="3.5" />

    <!-- Chevron Bridge (Delta of A) -->
    <path d="M 20 34.5 L 32 23.5 L 44 34.5 L 44 41 L 32 29.5 L 20 41 Z" />
  </g>

  <!-- Specular rim highlight on pillars for 3D metallic feel -->
  <rect x="17.5" y="16.5" width="3" height="14" rx="1.5" fill="url(#highlightGrad)" opacity="0.6" />
  <rect x="43.5" y="16.5" width="3" height="14" rx="1.5" fill="url(#highlightGrad)" opacity="0.6" />

  <!-- Quantum Star / Apex Node -->
  <g filter="url(#cyanGlow)">
    <polygon points="32,12 35.5,16 32,20 28.5,16" fill="#00f0ff" />
    <polygon points="32,13.5 34.2,16 32,18.5 29.8,16" fill="#ffffff" />
  </g>

  <!-- Subtle bottom horizontal energy accent -->
  <circle cx="32" cy="45" r="2" fill="#00f0ff" opacity="0.7" />
  <rect x="27" y="44.2" width="10" height="1.6" rx="0.8" fill="#38bdf8" opacity="0.5" />
</svg>